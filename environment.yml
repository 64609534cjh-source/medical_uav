# Exact conda environment for the Medical UAV project.
# Create with:  conda env create -f environment.yml
# Then:         conda activate medical-uav-rl && pip install -e .
name: medical-uav-rl
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11.17
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu  # CPU build of torch
      - numpy==2.4.6
      - gymnasium==1.4.0
      - matplotlib==3.11.2
      - imageio==2.38.1
      - imageio-ffmpeg==0.6.0
      - torch==2.14.1
      - pytest==9.1.1
