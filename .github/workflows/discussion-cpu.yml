name: Discussion CPU reproduction
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
          cache: pip
      - name: Install exact verified CPU dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
      - name: Unit and integration checks
        run: python -m pytest -q
      - name: Artifact, real PPO and Dev-only checks
        run: |
          python scripts/discussion.py verify
          python scripts/demo_network.py
          python scripts/discussion.py dev
          python scripts/discussion.py table
